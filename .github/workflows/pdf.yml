name: Byg og kontroller PDF
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-luatex texlive-latex-extra texlive-lang-european texlive-fonts-recommended
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tools.txt
      - name: Byg og kontroller kompendium
        run: make check
      - name: Byg statistikstruktur
        run: make statistik
      - name: Byg faglige skabeloner
        run: make templates
      - uses: actions/upload-artifact@v4
        with:
          name: matematikkompendium
          path: build/matematik/main.pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: statistik-struktur
          path: build/statistik/main.pdf
          if-no-files-found: error
