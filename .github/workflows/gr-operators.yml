name: Build GR Operators Reference PDF
on:
  push:
    branches: [main]
    paths:
      - 'Mit-projekt/05-General-Relativity-Reference/gr_operators.tex'
      - '.github/workflows/gr-operators.yml'
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile reference
        working-directory: Mit-projekt/05-General-Relativity-Reference
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error gr_operators.tex
          pdflatex -interaction=nonstopmode -halt-on-error gr_operators.tex
      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Mit-projekt/05-General-Relativity-Reference/gr_operators.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build GR operators and geometric calculus PDF"
            git push
          fi
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr-operators-reference-pdf
          path: Mit-projekt/05-General-Relativity-Reference/gr_operators.pdf
